/* =========================================================
   RANDOM NUMBER HELPER
   ========================================================= */

function shuffle(array) {

  for (let i = array.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [array[i], array[j]] = [array[j], array[i]];

  }

  return array;
}


/* =========================================================
   PREVIOUS QUESTION TRACKING
   ========================================================= */

const STORAGE_KEY = "f1TriviaUsedQuestions";

let usedQuestions =
  JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];


/* =========================================================
   CURRENT QUIZ VARIABLES
   ========================================================= */

let quizQuestions = [];

let currentQuestion = 0;

let score = 0;

let timeLeft = 15;

let timer;


/* =========================================================
   START QUIZ
   ========================================================= */

function startQuiz() {

  /*
    Find questions that haven't been used yet.
  */

  let available = questions
    .map((q, index) => index)
    .filter(index => !usedQuestions.includes(index));


  /*
    If fewer than 5 questions remain,
    start a fresh cycle.
  */

  if (available.length < 5) {

    usedQuestions = [];

    localStorage.removeItem(STORAGE_KEY);

    available = questions.map((q, index) => index);

  }


  /*
    Randomize the available questions.
  */

  shuffle(available);


  /*
    Take only five.
  */

  const selected = available.slice(0, 5);


  /*
    Remember these questions.
  */

  usedQuestions.push(...selected);

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(usedQuestions)
  );


  /*
    Create a copy of the selected questions.
  */

  quizQuestions = selected.map(index => {

    const original = questions[index];

    const answerObjects = original.a.map((answer, i) => ({
      text: answer,
      correct: i === original.c
    }));

    shuffle(answerObjects);

    return {
      q: original.q,
      answers: answerObjects
    };

  });


  currentQuestion = 0;

  score = 0;


  document.getElementById("startScreen").style.display = "none";

  document.getElementById("result").style.display = "none";

  document.getElementById("quiz").style.display = "block";


  showQuestion();

}


/* =========================================================
   SHOW QUESTION
   ========================================================= */

function showQuestion() {

  clearInterval(timer);

  timeLeft = 15;

  document.getElementById("time").textContent = timeLeft;


  document.getElementById("questionNumber").textContent =
    "Question " + (currentQuestion + 1) + "/5";


  document.getElementById("progressBar").style.width =
    (currentQuestion / 5) * 100 + "%";


  const q = quizQuestions[currentQuestion];


  document.getElementById("question").textContent = q.q;


  const answersDiv =
    document.getElementById("answers");

  answersDiv.innerHTML = "";


  q.answers.forEach((answer) => {

    const button =
      document.createElement("button");

    button.textContent = answer.text;

    button.classList.add("answer");

    button.onclick = () =>
      selectAnswer(answer.correct, button);

    answersDiv.appendChild(button);

  });


  document.getElementById("nextButton").style.display = "none";


  startTimer();

}


/* =========================================================
   TIMER
   ========================================================= */

function startTimer() {

  timer = setInterval(() => {

    timeLeft--;

    document.getElementById("time").textContent =
      timeLeft;


    if (timeLeft <= 0) {

      clearInterval(timer);

      disableAnswers();

      document.getElementById("nextButton").style.display =
        "block";

    }

  }, 1000);

}


/* =========================================================
   ANSWER
   ========================================================= */

function selectAnswer(isCorrect, button) {

  clearInterval(timer);

  disableAnswers();


  if (isCorrect) {

    button.classList.add("correct");

    score++;

  } else {

    button.classList.add("wrong");


    const buttons =
      document.querySelectorAll(".answer");


    quizQuestions[currentQuestion].answers
      .forEach((answer, index) => {

        if (answer.correct) {

          buttons[index].classList.add("correct");

        }

      });

  }


  document.getElementById("nextButton").style.display =
    "block";

}


/* =========================================================
   DISABLE ANSWERS
   ========================================================= */

function disableAnswers() {

  document.querySelectorAll(".answer").forEach(button => {

    button.disabled = true;

  });

}


/* =========================================================
   NEXT QUESTION
   ========================================================= */

function nextQuestion() {

  currentQuestion++;


  if (currentQuestion < 5) {

    showQuestion();

  } else {

    showResult();

  }

}


/* =========================================================

   ========================================================= */

function showResult() {

  clearInterval(timer);

  document.getElementById("quiz").style.display =
    "none";

  document.getElementById("result").style.display =
    "block";


  document.getElementById("finalScore").textContent =
    score + "/5";


  let rating;

    message = "You know your F1.";

  }

  else if (score
